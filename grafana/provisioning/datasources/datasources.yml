# Grafana 数据源 provisioning：启动时自动注册 Prometheus + Loki 数据源。
# 用法：把 grafana/provisioning/datasources/ 挂载到 Grafana 容器的 /etc/grafana/provisioning/datasources
# Prometheus: 抓取后端 /metrics 暴露的指标
# Loki: 聚合 Promtail 采集的容器日志(P0-2)
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  # P0-2: Loki 日志数据源
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
