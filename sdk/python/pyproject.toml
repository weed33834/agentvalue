[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentvalue"
version = "0.1.0"
description = "AgentValue 开放 API 的 Python SDK（出站 Webhook 签名校验 + API Key 门控客户端）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["agentvalue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
