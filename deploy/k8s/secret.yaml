# =============================================================================
# Secret 模板(占位符)
# -----------------------------------------------------------------------------
# !!!! 警告: 切勿将本文件的明文占位值直接用于生产环境 !!!!
#
# 生产环境推荐注入方式(任选其一):
#   1) 命令行创建(不入库):
#        kubectl create secret generic agentvalue-secret -n agentvalue \
#          --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#          --from-literal=DATABASE_URL='postgresql+asyncpg://agentvalue:强密码@postgres:5432/agentvalue' \
#          --from-literal=POSTGRES_USER='agentvalue' \
#          --from-literal=POSTGRES_PASSWORD='强密码' \
#          --from-literal=POSTGRES_DB='agentvalue'
#   2) Sealed Secrets: kubeseal 加密后提交 Git,集群内控制器解密还原;
#   3) External Secrets / HashiCorp Vault / 云 KMS 托管密钥。
#
# 本模板使用 stringData(明文)便于阅读与替换,Kubernetes 创建时会自动转为 base64 data。
# 如改用 data 字段,需自行 base64 编码。
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: agentvalue-secret
  labels:
    app.kubernetes.io/name: agentvalue
type: Opaque
stringData:
  # JWT 签名密钥: 生产必须为强随机值(>=32 字符)
  # 生成示例: openssl rand -hex 32
  JWT_SECRET_KEY: "CHANGE-ME-to-a-strong-random-secret-min-32-chars"

  # 后端数据库连接串(含凭据,故放 Secret)
  # 格式: postgresql+asyncpg://<用户>:<密码>@postgres:5432/<库名>
  DATABASE_URL: "postgresql+asyncpg://agentvalue:CHANGE_ME@postgres:5432/agentvalue"

  # PostgreSQL 凭据(供 postgres StatefulSet 初始化数据库使用)
  POSTGRES_USER: "agentvalue"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "agentvalue"

  # 字段级加密密钥(base64 编码的 32 字节);生产必填,否则敏感字段降级为明文
  # 生成: python -c "import base64,os; print(base64.b64encode(os.urandom(32)).decode())"
  FIELD_ENCRYPTION_KEY: "REPLACE_WITH_BASE64_ENCODED_32_BYTE_KEY"
