# =============================================================================
# ConfigMap - 非敏感配置
# -----------------------------------------------------------------------------
# 仅存放非敏感配置。密钥/密码/连接串凭据请放入 Secret(secret.yaml),切勿写在此处。
#
# 覆盖方式(支持环境变量覆盖):
#   - 修改本 ConfigMap 中的值后 `kubectl apply -k deploy/k8s/` 即可生效;
#   - 或在 backend-deployment.yaml 中追加 env 字段,同名 key 会覆盖本处取值;
#   - 或使用 kustomize overlay 覆盖 configMapGenerator。
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentvalue-config
  labels:
    app.kubernetes.io/name: agentvalue
    app.kubernetes.io/component: backend
data:
  # 运行环境标识: 仅 "production" 时启用生产安全校验(禁止 AUTH_DEMO_MODE 等)
  AGENTVALUE_ENV: "production"
  # 调试模式: 生产环境保持 false
  DEBUG: "false"
  # 演示模式: 生产必须 false(开启后允许通过 header 伪造身份,仅开发/测试用)
  AUTH_DEMO_MODE: "false"
  # Redis 连接地址(无认证,非敏感);如启用 Redis ACL/密码,请改用 Secret 注入
  REDIS_URL: "redis://redis:6379/0"
  # 向量库持久化目录(对应 backend PVC 挂载点)
  VECTOR_STORE_DIR: "/app/chroma_db"
  # 附件本地存储目录(降级路径;生产建议配置 S3_ENDPOINT 走对象存储/MinIO)
  ATTACHMENT_DIR: "/app/attachments"
  # CORS 允许来源(逗号分隔);改为实际前端域名(与 Ingress host 一致)
  CORS_ORIGINS: "https://agentvalue.example.com"
  # 数据库连接池参数(仅 PostgreSQL 生效,SQLite 使用 NullPool)
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_RECYCLE: "3600"
  DB_POOL_PRE_PING: "true"
  # 模型档位强制设定: auto / L0 / L1 / L2 / L3
  MODEL_TIER: "auto"
  # JWT 配置(算法与有效期;签名密钥 JWT_SECRET_KEY 在 Secret 中)
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "1440"
  # /metrics 端点鉴权模式: ip(仅私网) / token(需配 METRICS_BEARER_TOKEN) / none
  METRICS_AUTH_MODE: "ip"
  # Prometheus 查询地址(供 admin 时序聚合使用,按需调整)
  PROMETHEUS_URL: "http://prometheus:9090"
