# =============================================================================
# PostgreSQL StatefulSet + Service(单副本)+ 持久化
# -----------------------------------------------------------------------------
# 镜像: postgres:15-alpine   端口: 5432   副本: 1
# 凭据来自 agentvalue-secret(POSTGRES_USER/PASSWORD/DB)。
# 数据持久化: volumeClaimTemplates 自动创建 PVC postgres-data-postgres-0,
#   PV 由集群默认 StorageClass 动态提供(minikube/kind/云盘均内置动态供应)。
#   若集群无动态 StorageClass,请创建匹配的 PersistentVolume,或指定 storageClassName。
#
# 静态 PV 示例(无动态供应时使用,按需取消注释并创建):
# ---
# apiVersion: v1
# kind: PersistentVolume
# metadata:
#   name: postgres-pv
# spec:
#   capacity: { storage: 10Gi }
#   accessModes: ["ReadWriteOnce"]
#   persistentVolumeReclaimPolicy: Retain
#   hostPath: { path: /data/agentvalue/postgres }   # 单节点本地开发用,生产换云盘
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: agentvalue
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentvalue
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentvalue
        app.kubernetes.io/component: postgres
    spec:
      # 优雅终止:等待连接排空,避免数据损坏
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agentvalue-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentvalue-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: agentvalue-secret
                  key: POSTGRES_DB
          ports:
            - name: postgres
              containerPort: 5432
          # 存活探针: pg_isready 失败则重启
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # 就绪探针: pg_isready 通过才接流量
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  # 持久卷声明模板: 每个副本自动生成独立 PVC(单副本即 postgres-data-postgres-0)
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: agentvalue
          app.kubernetes.io/component: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        # storageClassName: ""   # 留空使用默认 StorageClass;静态 PV 时指定对应类名
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: agentvalue
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentvalue
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
