[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
# E2E 与性能测试需独立运行（依赖外部服务），默认排除
addopts = --ignore=tests/perf
# P1: 测试覆盖率门控 — 生成覆盖率报告,CI 中可加 --cov-fail-under=60 强制门控
# 本地运行不加 --cov 以保持速度; CI 中通过 addopts 覆盖:
#   pytest --cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=60
markers =
    e2e: end-to-end tests (require running services)
