# P1: Alertmanager 告警通知配置
#
# 将 Prometheus 告警路由到通知通道:
# - critical: 飞书/钉钉 Webhook + 邮件
# - warning: 邮件
#
# 使用方式:
#   1. 将此文件挂载到 Alertmanager 容器
#   2. 在 prometheus.yml 中添加:
#      alerting:
#        alertmanagers:
#          - static_configs:
#              - targets: ['alertmanager:9093']
#   3. 通过环境变量覆盖通知配置(docker-compose.prod.yml 已处理)
#      - ALERT_WEBHOOK_URL: 飞书/钉钉 Webhook 地址
#      - ALERT_EMAIL_TO: 告警邮件收件人
#      - SMTP_HOST / SMTP_USER / SMTP_PASS: SMTP 认证信息
#
# 注意: Alertmanager 原生不支持 ${VAR:default} 环境变量替换语法。
# 此处使用静态默认值,通过 docker-compose 环境变量在容器启动时注入。
# 如需动态配置,可使用 alertmanager --config.expand-env=true 或 entrypoint 脚本。

global:
  resolve_timeout: 5m
  # SMTP 配置(生产环境通过 entrypoint 脚本或 config.expand-env 注入)
  smtp_smarthost: localhost:587
  smtp_from: alertmanager@agentvalue.ai
  # smtp_auth_username / smtp_auth_password 通过环境变量在 entrypoint 中注入

# 告警路由规则
route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    # critical 告警: 即时通知 Webhook + 邮件
    - match:
        severity: critical
      receiver: "critical-webhook"
      group_wait: 10s
      repeat_interval: 1h
    # warning 告警: 邮件通知
    - match:
        severity: warning
      receiver: "warning-email"

receivers:
  - name: "default"
    email_configs:
      - to: admin@agentvalue.ai
        send_resolved: true

  - name: "critical-webhook"
    webhook_configs:
      # 飞书/钉钉 Webhook
      # 生产部署时通过 alertmanager --config.expand-env=true 替换 $ALERT_WEBHOOK_URL
      - url: http://localhost:9093
        send_resolved: true
    email_configs:
      - to: admin@agentvalue.ai
        send_resolved: true

  - name: "warning-email"
    email_configs:
      - to: admin@agentvalue.ai
        send_resolved: true

# 告警抑制规则(避免告警风暴)
inhibit_rules:
  # 评估失败率高时抑制 P99 延迟告警(失败率说明已有问题)
  - source_match:
      alertname: EmpvalueEvaluationFailureRateHigh
    target_match:
      alertname: EmpvalueEvaluationP99LatencyHigh
    equal: ["service"]
